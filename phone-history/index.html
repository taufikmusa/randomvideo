<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>THE PHONE — 150 Years</title>
<style>
@font-face{font-family:Orb;font-weight:700;src:url(fonts/Orbitron-700.ttf)}
@font-face{font-family:Orb;font-weight:900;src:url(fonts/Orbitron-900.ttf)}
@font-face{font-family:Grot;font-weight:500;src:url(fonts/SpaceGrotesk-500.ttf)}
@font-face{font-family:Grot;font-weight:700;src:url(fonts/SpaceGrotesk-700.ttf)}
@font-face{font-family:Mono;font-weight:400;src:url(fonts/SpaceMono-400.ttf)}
@font-face{font-family:Mono;font-weight:700;src:url(fonts/SpaceMono-700.ttf)}
html,body{margin:0;background:#000}
canvas{display:block;width:360px;height:640px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, CX = W / 2, IY = 860;
const BPM = 120, BEAT = 60 / BPM, BAR = BEAT * 4, DUR = 90;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const bx = buf.getContext('2d');

// ------------------------------------------------------------ utils
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eback = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const TAU = Math.PI * 2;

// ------------------------------------------------------------ colour grade: sepia amber (wired) -> mint (mobile) -> cyan/magenta (smartphone)
const KEYS = [
  [0, [255, 178, 80], [255, 110, 40]],
  [30, [255, 178, 80], [255, 110, 40]],
  [40, [120, 255, 190], [60, 200, 255]],
  [50, [90, 255, 210], [60, 190, 255]],
  [54, [210, 245, 255], [120, 200, 255]],
  [58, [62, 226, 255], [255, 70, 230]],
  [90, [62, 226, 255], [255, 70, 230]],
];
let A = [255, 178, 80], B = [255, 110, 40];
function grade(t) {
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const [t0, a0, b0] = KEYS[i], [t1, a1, b1] = KEYS[i + 1];
  const x = clamp((t - t0) / (t1 - t0));
  A = a0.map((v, k) => Math.round(lerp(v, a1[k], x)));
  B = b0.map((v, k) => Math.round(lerp(v, b1[k], x)));
}
const ca = (a = 1) => `rgba(${A[0]},${A[1]},${A[2]},${a})`;
const cb = (a = 1) => `rgba(${B[0]},${B[1]},${B[2]},${a})`;

// ------------------------------------------------------------ text
function htext(str, y, size, o = {}) {
  const { font = 'Orb', weight = 900, alpha = 1, track = 0, glow = 34, scale = 1, lh = 1.08, grad = true, color = null } = o;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = clamp(alpha);
  ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = track + 'px';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lines = String(str).split('\n');
  lines.forEach((ln, i) => {
    const yy = y + (i - (lines.length - 1) / 2) * size * lh;
    ctx.save(); ctx.translate(CX, yy); ctx.scale(scale, scale);
    if (color) ctx.fillStyle = color;
    else if (grad) {
      const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#ffffff'); g.addColorStop(1, ca(1));
      ctx.fillStyle = g;
    } else ctx.fillStyle = '#fff';
    ctx.shadowColor = ca(0.85); ctx.shadowBlur = glow;
    ctx.fillText(ln, 0, 0);
    ctx.shadowBlur = 0; ctx.fillText(ln, 0, 0);
    ctx.restore();
  });
  ctx.restore();
}
function ptext(str, y, size, alpha = 1, o = {}) {
  const { color = '#dfe9f2', weight = 500, font = 'Grot', track = 1, lh = 1.32 } = o;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = clamp(alpha); ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = track + 'px';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.95)'; ctx.shadowBlur = 16;
  String(str).split('\n').forEach((l, i, a) => ctx.fillText(l, CX, y + (i - (a.length - 1) / 2) * size * lh));
  ctx.restore();
}
function mono(str, y, size, alpha = 1, color = null, track = 10) { ptext(str, y, size, alpha, { font: 'Mono', weight: 700, color: color || ca(1), track }); }

// ------------------------------------------------------------ background
function intensity(t) {
  if (t < 4 * BAR) return 0.15;
  if (t < 16 * BAR) return 0.3;
  if (t < 26 * BAR) return 0.55;
  if (t < 28 * BAR) return 0.25;
  if (t < 32 * BAR) return 0.75;
  if (t < 36 * BAR) return lerp(0.8, 1.1, (t - 32 * BAR) / (4 * BAR));
  if (t < 42 * BAR) return 1.2;
  return 0.4;
}
const TRAV = []; { let s = 0; for (let f = 0; f <= DUR * 30 + 2; f++) { TRAV.push(s); s += intensity(f / 30) / 30; } }
function beatPulse(t) {
  if (t < 4 * BAR) return 0;
  if (t >= 26 * BAR && t < 27 * BAR) return 0;
  if (t >= 35.875 * BAR && t < 36 * BAR) return 0;
  const ph = (t % BEAT) / BEAT;
  const every = t < 16 * BAR ? (Math.floor(t / BEAT) % 2 === 0 ? 1 : 0) : 1;
  return Math.exp(-ph * 7) * every;
}
const PTS = []; { const r = mulberry(42); for (let i = 0; i < 180; i++) PTS.push({ x: r() * W, y: r() * H, z: 0.3 + r() * 1.2, s: r() * TAU, k: r() }); }

function background(t) {
  const I = intensity(t), tr = TRAV[Math.min(TRAV.length - 1, Math.round(t * 30))], bp = beatPulse(t);
  ctx.fillStyle = '#03050a'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(CX, IY, 0, CX, IY, H * 0.7);
  g.addColorStop(0, cb(0.16 + 0.14 * I + 0.1 * bp)); g.addColorStop(0.5, ca(0.05)); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // perspective grid floor
  const hz = 1180;
  ctx.save();
  ctx.strokeStyle = ca(0.10 + 0.08 * I); ctx.lineWidth = 2;
  for (let i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(CX + i * 20, hz); ctx.lineTo(CX + i * 260, H); ctx.stroke(); }
  for (let k = 0; k < 14; k++) {
    const z = ((k / 14 + tr * 0.9) % 1);
    const y = hz + (H - hz) * z * z;
    ctx.globalAlpha = z; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
  const hg = ctx.createLinearGradient(0, hz - 140, 0, hz + 60);
  hg.addColorStop(0, 'rgba(3,5,10,0)'); hg.addColorStop(0.7, 'rgba(3,5,10,0.9)'); hg.addColorStop(1, 'rgba(3,5,10,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, hz - 140, W, 200);
  // signal rings on the beat
  if (t >= 16 * BAR && t < 42 * BAR) {
    const ph = (t % BEAT) / BEAT;
    ctx.save(); ctx.strokeStyle = ca(0.35 * (1 - ph) * I); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(CX, IY, 340 + ph * 260, 0, TAU); ctx.stroke(); ctx.restore();
  }
  // data particles
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of PTS) {
    const y = ((p.y - tr * 300 * p.z) % H + H) % H;
    const x = p.x + Math.sin(tr + p.s) * 20;
    const a = 0.2 + 0.5 * (0.5 + 0.5 * Math.sin(t * 5 + p.s * 4));
    ctx.fillStyle = p.k > 0.8 ? cb(a) : ca(a);
    const s = 2 + p.z * 2.5;
    if (I > 0.7 && p.k > 0.6) ctx.fillRect(x, y, 2, s * 6 * I); else ctx.fillRect(x, y, s, s);
  }
  ctx.restore();
}

const SCAN = document.createElement('canvas'); SCAN.width = W; SCAN.height = H;
{ const s = SCAN.getContext('2d'); s.fillStyle = 'rgba(0,0,0,0.16)'; for (let y = 0; y < H; y += 4) s.fillRect(0, y, W, 2); }
const GR = [];
for (let k = 0; k < 6; k++) {
  const c = document.createElement('canvas'); c.width = 360; c.height = 640;
  const x = c.getContext('2d'), im = x.createImageData(360, 640), rr = mulberry(7 + k);
  for (let i = 0; i < im.data.length; i += 4) { const v = rr() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  x.putImageData(im, 0, 0); GR.push(c);
}
function finish(t, frame) {
  ctx.drawImage(SCAN, 0, 0);
  const v = ctx.createRadialGradient(CX, H / 2, H * 0.28, CX, H / 2, H * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.05; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(GR[frame % GR.length], 0, 0, W, H); ctx.restore();
  // HUD corner brackets
  ctx.save(); ctx.strokeStyle = ca(0.5); ctx.lineWidth = 3; const m = 44, L = 60;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke();
  });
  ctx.restore();
}

// ------------------------------------------------------------ neon painters
function neon(w = 8, blur = 26, a = 1) { ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.shadowColor = ca(1); ctx.shadowBlur = blur; }
function neonA(w = 8, blur = 26) { ctx.strokeStyle = ca(1); ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.shadowColor = ca(1); ctx.shadowBlur = blur; }
function fillA(a = 1, blur = 26) { ctx.fillStyle = ca(a); ctx.shadowColor = ca(1); ctx.shadowBlur = blur; }
function fillB(a = 1, blur = 26) { ctx.fillStyle = cb(a); ctx.shadowColor = cb(1); ctx.shadowBlur = blur; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function waves(x, y, n, t, dir = 0, r0 = 40, spread = 0.7) {
  for (let i = 0; i < n; i++) {
    const ph = (t * 1.2 + i / n) % 1;
    ctx.save(); ctx.globalAlpha = 1 - ph; neonA(6, 20);
    ctx.beginPath(); ctx.arc(x, y, r0 + ph * 120, dir - spread, dir + spread); ctx.stroke(); ctx.restore();
  }
}
function slab(w, h, r, glass = true) {
  ctx.fillStyle = '#060a12'; rr(-w / 2, -h / 2, w, h, r); ctx.fill();
  neon(8); ctx.stroke();
  if (glass) { ctx.save(); ctx.clip(); ctx.shadowBlur = 0; const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); g.addColorStop(0, ca(0.12)); g.addColorStop(0.5, 'rgba(255,255,255,0.03)'); g.addColorStop(1, cb(0.1)); ctx.fillStyle = g; ctx.fill(); ctx.restore(); }
}
function keypad(x0, y0, dx, dy, lit = -1, r = 16) {
  for (let i = 0; i < 12; i++) {
    const x = x0 + (i % 3) * dx, y = y0 + Math.floor(i / 3) * dy;
    if (i === lit) { fillA(1, 30); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
    else { neon(4, 10, 0.8); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); }
  }
}

const ICON = {
  bell(lt) {
    const ring = (lt % 2) < 1.25 ? 1 : 0;
    const sh = ring * Math.sin(lt * 130) * 7;
    ctx.save(); ctx.translate(sh, 0);
    neon(9);
    [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(s * 120, 0, 110, Math.PI, 0); ctx.closePath(); ctx.stroke(); fillA(0.15, 0); ctx.fill(); });
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 150); ctx.stroke();
    ctx.save(); ctx.translate(0, 0); ctx.rotate(ring * Math.sin(lt * 130) * 0.5);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -90); ctx.stroke(); fillA(1, 30); ctx.beginPath(); ctx.arc(0, -100, 20, 0, TAU); ctx.fill();
    ctx.restore(); ctx.restore();
    if (ring) { waves(-120, -40, 3, lt, -Math.PI * 0.75, 140, 0.5); waves(120, -40, 3, lt, -Math.PI * 0.25, 140, 0.5); }
  },
  candlestick(lt) {
    neon(9);
    ctx.beginPath(); ctx.ellipse(0, 260, 130, 30, 0, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-30, 240); ctx.lineTo(-18, -150); ctx.moveTo(30, 240); ctx.lineTo(18, -150); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-18, -150); ctx.lineTo(-70, -250); ctx.lineTo(70, -250); ctx.lineTo(18, -150); ctx.stroke();
    fillA(0.2, 0); ctx.fill();
    // receiver on hook
    ctx.save(); ctx.translate(90, -60); ctx.rotate(Math.sin(lt * 3) * 0.05);
    neon(9); ctx.beginPath(); ctx.moveTo(-60, -50); ctx.lineTo(0, -50); ctx.stroke();
    rr(0, -80, 40, 170, 18); ctx.stroke(); ctx.restore();
    // cord
    neonA(4, 12); ctx.beginPath(); ctx.moveTo(110, 110); ctx.bezierCurveTo(200, 250, 60, 320, 200, 330); ctx.stroke();
    waves(0, -250, 3, lt, -Math.PI / 2, 60);
  },
  switchboard(lt) {
    neon(7); rr(-300, -260, 600, 520, 20); ctx.stroke();
    const r = mulberry(3);
    const J = []; for (let j = 0; j < 5; j++) for (let i = 0; i < 6; i++) J.push([-240 + i * 96, -190 + j * 90]);
    J.forEach(([x, y]) => { neon(4, 8, 0.7); ctx.beginPath(); ctx.arc(x, y, 14, 0, TAU); ctx.stroke(); });
    for (let k = 0; k < 7; k++) {
      const a = J[Math.floor(r() * 30)], b = J[Math.floor(r() * 30)];
      const p = eo(lt * 1.3 - k * 0.12); if (p <= 0) continue;
      ctx.save(); neonA(6, 20);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]);
      const mx = lerp(a[0], b[0], p), my = lerp(a[1], b[1], p);
      ctx.quadraticCurveTo((a[0] + mx) / 2, Math.max(a[1], my) + 120, mx, my); ctx.stroke();
      fillA(1, 20); ctx.beginPath(); ctx.arc(mx, my, 10, 0, TAU); ctx.fill(); ctx.restore();
    }
  },
  rotary(lt) {
    neon(9); ctx.beginPath(); ctx.arc(0, 0, 260, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 90, 0, TAU); ctx.stroke();
    const spin = lt < 0.6 ? -eo(lt / 0.6) * 1.6 : -1.6 * (1 - eo((lt - 0.6) / 0.9));
    ctx.save(); ctx.rotate(spin);
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI * 0.35 + i * (Math.PI * 1.45 / 9);
      neon(6, 14); ctx.beginPath(); ctx.arc(Math.cos(a) * 180, Math.sin(a) * 180, 42, 0, TAU); ctx.stroke();
    }
    ctx.restore();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI * 0.35 + i * (Math.PI * 1.45 / 9);
      ctx.save(); ctx.fillStyle = ca(0.9); ctx.font = '700 36px Mono'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String((i + 1) % 10), Math.cos(a) * 180, Math.sin(a) * 180); ctx.restore();
    }
    neonA(10); ctx.beginPath(); ctx.moveTo(200, 130); ctx.lineTo(250, 190); ctx.stroke();
  },
  coast(lt) {
    const p = eo(lt * 0.9);
    neon(6, 14);
    for (let i = 0; i < 6; i++) {
      const x = -330 + i * 132;
      ctx.beginPath(); ctx.moveTo(x, 200); ctx.lineTo(x, -40); ctx.moveTo(x - 36, -20); ctx.lineTo(x + 36, -20); ctx.stroke();
    }
    ctx.save(); ctx.beginPath(); ctx.rect(-400, -200, 800 * p, 500); ctx.clip();
    neonA(5, 22);
    for (let i = 0; i < 5; i++) { const x = -330 + i * 132; ctx.beginPath(); ctx.moveTo(x - 30, -20); ctx.quadraticCurveTo(x + 66, 30, x + 132 - 30, -20); ctx.stroke(); }
    ctx.restore();
    fillA(1, 30); ctx.beginPath(); ctx.arc(-330, 240, 14, 0, TAU); ctx.fill();
    ctx.globalAlpha = p; ctx.beginPath(); ctx.arc(330, 240, 14, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    ctx.save(); ctx.fillStyle = '#fff'; ctx.font = '700 34px Mono'; ctx.textAlign = 'center'; ctx.shadowBlur = 0;
    ctx.fillText('NEW YORK', -300, 300); ctx.globalAlpha = p; ctx.fillText('SAN FRANCISCO', 250, 300); ctx.restore();
  },
  ocean(lt) {
    neon(6, 14); ctx.beginPath(); ctx.arc(0, 420, 480, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    for (let i = 0; i < 5; i++) { ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(-200 + i * 90, 110 + (i % 2) * 10); ctx.quadraticCurveTo(-170 + i * 90, 90, -140 + i * 90, 110); ctx.stroke(); }
    ctx.globalAlpha = 1;
    const p = eo(lt * 0.9);
    neonA(6, 24); ctx.setLineDash([18, 16]); ctx.lineDashOffset = -lt * 80;
    ctx.beginPath(); ctx.moveTo(-280, 20);
    const steps = 30; for (let i = 1; i <= steps * p; i++) { const x = lerp(-280, 280, i / steps); ctx.lineTo(x, 20 - Math.sin(i / steps * Math.PI) * 260); } ctx.stroke(); ctx.setLineDash([]);
    [[-280, 'NEW YORK'], [280, 'LONDON']].forEach(([x, n], k) => {
      ctx.save(); ctx.globalAlpha = k ? p : 1; fillA(1, 30); ctx.beginPath(); ctx.arc(x, 20, 16, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.shadowBlur = 0; ctx.font = '700 34px Mono'; ctx.textAlign = 'center'; ctx.fillText(n, x, 80); ctx.restore();
    });
    waves(-280, 20, 3, lt, -Math.PI / 2, 30, 0.8);
  },
  car(lt) {
    neon(8);
    ctx.beginPath(); ctx.moveTo(-320, 180); ctx.lineTo(-320, 100); ctx.quadraticCurveTo(-300, 60, -220, 50); ctx.lineTo(-140, -30); ctx.quadraticCurveTo(-60, -80, 80, -40); ctx.lineTo(180, 50); ctx.quadraticCurveTo(310, 60, 320, 120); ctx.lineTo(320, 180); ctx.closePath(); ctx.stroke();
    [-190, 190].forEach(x => { ctx.beginPath(); ctx.arc(x, 180, 55, 0, TAU); ctx.fillStyle = '#03050a'; ctx.fill(); ctx.stroke(); });
    ctx.beginPath(); ctx.moveTo(250, 50); ctx.lineTo(260, -160); ctx.stroke();
    waves(260, -170, 3, lt, -Math.PI / 2, 30, 0.9);
    ctx.save(); ctx.translate(-40, -230); ctx.rotate(-0.3 + Math.sin(lt * 3) * 0.05); neonA(10, 26);
    ctx.beginPath(); ctx.moveTo(-90, 0); ctx.quadraticCurveTo(0, -40, 90, 0); ctx.stroke();
    rr(-120, -10, 60, 40, 14); ctx.stroke(); rr(60, -10, 60, 40, 14); ctx.stroke(); ctx.restore();
  },
  touchtone(lt) {
    ctx.save(); slab(380, 560, 40, false); ctx.restore();
    keypad(-100, -150, 100, 100, [0, 1, 5, 7, 10, 3, 2, 6][Math.floor(lt * 4) % 8], 34);
  },
  brick(lt, battery = false) {
    ctx.save(); ctx.translate(0, 40);
    neon(8); ctx.beginPath(); ctx.moveTo(60, -250); ctx.lineTo(60, -380); ctx.stroke();
    fillA(1, 30); ctx.beginPath(); ctx.arc(60, -385, 12, 0, TAU); ctx.fill();
    ctx.save(); slab(200, 520, 30, false); ctx.restore();
    neon(5, 10); rr(-70, -200, 140, 70, 8); ctx.stroke();
    if (battery) { const p = clamp(lt / 1.6); fillA(0.9, 18); ctx.fillRect(-60, -190, 120 * p, 50); }
    else { ctx.save(); ctx.fillStyle = ca(1); ctx.font = '700 30px Mono'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('CALL'.slice(0, 1 + Math.floor(lt * 5) % 5), 0, -165); ctx.restore(); }
    keypad(-60, -60, 60, 62, Math.floor(lt * 6) % 12, 18);
    ctx.restore();
    if (!battery) waves(60, -345, 3, lt, -Math.PI / 2, 40, 0.8);
  },
  tower(lt) {
    const hx = (x, y, r) => { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); };
    const r = 110;
    const cells = [[0, 0]]; for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + Math.PI / 6; cells.push([Math.cos(a) * r * Math.sqrt(3), Math.sin(a) * r * Math.sqrt(3)]); }
    cells.forEach(([x, y], i) => { const p = eo(lt * 2.5 - i * 0.1); if (p <= 0) return; ctx.save(); ctx.globalAlpha = p; neonA(4, 14); hx(x, y, r - 6); ctx.stroke(); ctx.globalAlpha = p * 0.12; fillA(1, 0); ctx.fill(); ctx.restore(); });
    neon(8); ctx.beginPath(); ctx.moveTo(-40, 100); ctx.lineTo(0, -90); ctx.lineTo(40, 100); ctx.moveTo(-26, 40); ctx.lineTo(26, 40); ctx.moveTo(-14, -20); ctx.lineTo(14, -20); ctx.stroke();
    waves(0, -95, 3, lt, -Math.PI / 2, 30, 1.2);
  },
  sms(lt) {
    const txt = 'Merry Christmas', n = Math.floor(clamp(lt / 1.2) * txt.length);
    ctx.save(); ctx.translate(0, -40);
    neon(8); rr(-330, -110, 660, 200, 50); ctx.stroke(); fillA(0.12, 0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(200, 90); ctx.lineTo(260, 170); ctx.lineTo(120, 90); neon(8); ctx.stroke();

function era(year, icon, title, sub, o = {}) {
  const fn = (lt, d) => {
    const k = Math.min(1, d / 1.4), T = lt / k;
    ctx.save(); ctx.translate(CX, IY); const z = lerp(1.2, 1, eo(T * 2.2)) + 0.02 * beatPulse(curT); ctx.scale(z * (o.s || 1), z * (o.s || 1));

    htext(year, 330 + (1 - eo(T * 3)) * 50, o.yearSize || 170, { alpha: eo(T * 3), track: 10 });
    if (o.place) mono(o.place, 450, 34, eo(T * 3 - 0.3));

  sc(34 + i / 4, 34 + (i + 1) / 4, (lt, d) => {
    const T = lt / d;
    htext(w, 960, w.length > 6 ? 130 : 180, { track: 10, scale: lerp(1.6, 1, eo(T * 4)) + T * 0.05, glow: 60 });
    mono(String(i + 1).padStart(2, '0') + ' / 07', 1130, 34, 0.9, null, 8);
  }, '2026');
});
sc(35.75, 36, (lt, d) => {
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H);
  const r = 4 + 36 * (lt / d) ** 2; fillA(1, 80); ctx.beginPath(); ctx.arc(CX, 960, r, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
}, '2026');

// DROP
sc(36, 38, (lt) => {
  ctx.save(); ctx.translate(CX, IY); ICON.globe(lt); ctx.restore();
  mono('TODAY', 330, 40, eo(lt * 3), null, 20);
  const n = (8 * eo(lt / 1.3)).toFixed(1);
  htext(n + ' BILLION+', 1320, 110, { track: 4, glow: 50 });
  htext('MOBILE CONNECTIONS', 1440, 54, { font: 'Grot', weight: 700, track: 6, alpha: eo(lt * 2), glow: 20 });
  ptext('More than there are\npeople on Earth', 1570, 44, eo(lt * 2 - 0.8));
}, '2026');
sc(38, 40, (lt) => {
  ctx.save(); ctx.translate(CX, IY); ICON.apollo(lt); ctx.restore();
  mono('YOUR PHONE vs APOLLO 11', 330, 36, eo(lt * 3), null, 8);
  htext('MILLIONS\nOF TIMES', 1360, 100, { track: 4, glow: 50, scale: lerp(1.2, 1, eo(lt * 2)) });
  ptext('more computing power than the\ncomputer that landed on the Moon', 1580, 42, eo(lt * 2 - 0.6));
}, '2026');
const evo = [['candlestick', '1876'], ['rotaryphone', '1919'], ['touchtone', '1963'], ['brick', '1983'], ['flip', '1996'], ['candybar', '2000'], ['smart', '2007'], ['fold', '2019']];
evo.forEach(([icon, year], i) => {
  sc(40 + i / 4, 40 + (i + 1) / 4, (lt, d) => {
    const T = lt / d;
    htext(i < 4 ? 'FROM WIRES' : 'TO WIRELESS', 360, 76, { font: 'Grot', weight: 700, track: 8, glow: 30 });
    ctx.save(); ctx.translate(CX, IY + 20); const z = lerp(0.95, 0.8, eo(T * 3)); ctx.scale(z, z); ICON[icon](0.8 + lt, icon === 'brick'); ctx.restore();
    htext(year, 1420, 150, { track: 12, scale: lerp(1.3, 1, eo(T * 4)), glow: 40 });
  }, year);
});

// FINALE
sc(42, 45, (lt) => {
  const s = eo(lt / 0.9);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(CX, 820, 0, CX, 820, 560); g.addColorStop(0, ca(0.35 * s)); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  htext('THE PHONE', 800, 124, { alpha: s, track: lerp(30, 6, s), glow: 70, scale: 1 + lt * 0.008 });
  ctx.save(); ctx.fillStyle = ca(0.9); ctx.shadowColor = ca(1); ctx.shadowBlur = 20; const w = 560 * eo((lt - 0.3) / 0.8); ctx.fillRect(CX - w / 2, 905, w, 4); ctx.restore();
  mono('150 YEARS OF CONNECTION', 980, 36, eo((lt - 0.6) / 0.6), null, 8);
  ptext('The whole world,\nin the palm of your hand.', 1130, 50, eo((lt - 1.2) / 0.6), { weight: 700 });
  if (lt > 4) {
    const k = lt - 4;
    ctx.save(); ctx.translate(CX, 1450); ctx.scale(0.35, 0.35); ctx.globalAlpha = eo(k / 0.3); ICON.bell(k * 1.0 + 0.0); ctx.restore(); ctx.globalAlpha = 1;
    mono('WHO WILL YOU CALL NEXT?', 1620, 34, eo((k - 0.2) / 0.4), '#ffffff', 8);
  }
  if (lt > 5.3) { ctx.fillStyle = `rgba(0,0,0,${clamp((lt - 5.3) / 0.65)})`; ctx.fillRect(0, 0, W, H); }
}, '2026');

// ------------------------------------------------------------ HUD: era timeline + signal bars
function hud(t, s) {
  if (t < 4 * BAR || t >= 36 * BAR) return;
  const yr = parseInt(s.year) || 2026;
  const p = clamp((yr - 1876) / 150);
  ctx.save();
  ctx.strokeStyle = ca(0.3); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(150, 170); ctx.lineTo(W - 150, 170); ctx.stroke();
  ctx.fillStyle = ca(0.9); ctx.fillRect(150, 168, (W - 300) * p, 4);
  ctx.shadowColor = ca(1); ctx.shadowBlur = 20; ctx.beginPath(); ctx.arc(150 + (W - 300) * p, 170, 9, 0, TAU); ctx.fill();
  ctx.restore();
  const lbl = (txt, x, y, align) => { ctx.save(); ctx.font = '700 24px Mono'; ctx.fillStyle = ca(0.7); ctx.textAlign = align; ctx.letterSpacing = '4px'; ctx.fillText(txt, x, y); ctx.restore(); };
  lbl('1876', 150, 205, 'left'); lbl('2026', W - 150, 205, 'right');
  // signal bars: none while wired
  const bars = yr < 1946 ? 0 : yr < 1973 ? 1 : yr < 1991 ? 2 : yr < 2001 ? 3 : yr < 2009 ? 4 : 5;
  ctx.save(); ctx.translate(W - 222, 96);
  for (let i = 0; i < 5; i++) { ctx.fillStyle = i < bars ? ca(1) : 'rgba(255,255,255,0.15)'; ctx.fillRect(i * 16, 30 - i * 7, 10, 8 + i * 7); }
  ctx.restore();
  lbl(bars ? 'MOBILE' : 'WIRED', 150, 132, 'left');
}

// ------------------------------------------------------------ main render
function render(t, frame = Math.round(t * 30)) {
  curT = t;
  grade(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-over';
  background(t);
  const s = S.find(x => t >= x.t0 && t < x.t1) || S[S.length - 1];
  const lt = t - s.t0, d = s.t1 - s.t0;
  const I = intensity(t), bp = beatPulse(t);
  const sh = (t >= 36 * BAR && t < 42 * BAR) ? 10 * bp : (t >= 34 * BAR && t < 35.75 * BAR ? 6 * bp + 3 : 0);
  const r = mulberry(frame + 3);
  ctx.save();
  ctx.translate(CX + (r() - 0.5) * sh * 2, H / 2 + (r() - 0.5) * sh * 2);
  const zoom = 1 + 0.015 * bp * I; ctx.scale(zoom, zoom); ctx.translate(-CX, -H / 2);
  s.fn(lt, d);
  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  hud(t, s);
  // digital glitch on cuts from the smartphone era on
  if (t >= 28 * BAR && lt < 0.1 && s.t0 !== 35.75 * BAR) {
    bx.clearRect(0, 0, W, H); bx.drawImage(cv, 0, 0);
    const g = mulberry(frame * 7 + 1), amt = 90 * (1 - lt / 0.1);
    for (let i = 0; i < 9; i++) { const y = g() * H, h = 16 + g() * 110, dx = (g() - 0.5) * amt * 2; ctx.drawImage(buf, 0, y, W, h, dx, y, W, h); }
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35 * (1 - lt / 0.1); ctx.drawImage(buf, 8, 0); ctx.restore();
  }
  // cut flash
  const flashLen = t < 16 * BAR ? 0.3 : 0.16;
  const big = [26, 28, 36, 42].some(b => Math.abs(s.t0 - b * BAR) < 1e-6);
  if (s.t0 > 0 && lt < flashLen && s.t0 !== 35.75 * BAR) {
    const a = (1 - lt / flashLen) ** 2 * (big ? 0.95 : 0.45);
    ctx.fillStyle = `rgba(235,248,255,${a})`; ctx.fillRect(0, 0, W, H);
  }
  finish(t, frame);
  if (t < 0.5) { ctx.fillStyle = `rgba(0,0,0,${1 - t / 0.5})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render;
window.ready = (async () => {
  await Promise.all(['900 40px Orb', '700 40px Orb', '500 40px Grot', '700 40px Grot', '400 40px Mono', '700 40px Mono'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  render(0);
  return true;
})();
</script>
</body>
