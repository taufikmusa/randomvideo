<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Carousel Sabar</title>
<style>
@font-face{font-family:AN;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:PF;font-weight:900;font-style:normal;src:url(fonts/Playfair-900.woff2)}
@font-face{font-family:PF;font-weight:700;font-style:italic;src:url(fonts/Playfair-700i.woff2)}
@font-face{font-family:IN;font-weight:500;src:url(fonts/Inter-500.woff2)}
@font-face{font-family:IN;font-weight:800;src:url(fonts/Inter-800.woff2)}
@font-face{font-family:IN;font-weight:900;src:url(fonts/Inter-900.woff2)}
@font-face{font-family:MO;font-weight:700;src:url(fonts/Mono-700.woff2)}
html,body{margin:0;background:#000}
canvas{display:block;width:1800px;height:450px}
</style>
</head>
<body>
<canvas id="c" width="5400" height="1350"></canvas>
<script>
// 5-slide IG carousel "Sabar" — thumbnail style (Anton + brush blocks + white-outline portraits), seamless panorama.
const SW = 1080, SH = 1350, N = 5; window.N = N;
const C = { navy: '#07152B', y: '#FFCE32', red: '#E0262E', dred: '#3a0a0e', green: '#16A34A', ink: '#0b0b0b' };
const X = document.getElementById('c').getContext('2d');
const IMG = {};
const font = (f, w, s, i) => f === 'AN' ? `${s}px AN` : `${i ? 'italic ' : ''}${w} ${s}px ${f}`;
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function txt(s, x, y, f, fill, align = 'left', ls = 0) { X.save(); X.font = f; X.textAlign = align; X.letterSpacing = ls + 'px'; X.fillStyle = fill; X.fillText(s, x, y); X.restore(); }
function tw(s, f, ls = 0) { X.save(); X.font = f; X.letterSpacing = ls + 'px'; const w = X.measureText(s).width; X.restore(); return w; }
function rr(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function gold(x0, y0, x1, y1) { const g = X.createLinearGradient(x0, y0, x1, y1); [[0, '#b07a12'], [.3, '#ffd23f'], [.5, '#fff3b0'], [.7, '#ffc81f'], [1, '#c98e12']].forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function wrap(s, f, maxW) { X.save(); X.font = f; const out = []; let line = ''; for (const w of s.split(' ')) { const t = line ? line + ' ' + w : w; if (X.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; } out.push(line); X.restore(); return out; }
function para(s, x, y, f, lh, fill, maxW, align = 'left') { const ls = wrap(s, f, maxW); ls.forEach((l, i) => txt(l, x, y + i * lh, f, fill, align)); return y + ls.length * lh; }
// rough brush-stroke block (thumbnail style)
function brush(x, y, w, h, col, seed = 1) {
  const R = rng(seed); X.save(); X.fillStyle = col; X.beginPath();
  X.moveTo(x + R() * 14, y + R() * 10);
  for (let i = 1; i <= 24; i++) X.lineTo(x + w * i / 24, y + (R() - .5) * 14);
  for (let i = 1; i <= 10; i++) X.lineTo(x + w + (R() - .3) * 26, y + h * i / 10);
  for (let i = 23; i >= 0; i--) X.lineTo(x + w * i / 24, y + h + (R() - .5) * 14);
  for (let i = 9; i > 0; i--) X.lineTo(x - (R() - .3) * 26, y + h * i / 10);
  X.closePath(); X.fill();
  for (let i = 0; i < 40; i++) { X.globalAlpha = .5 + R() * .5; X.fillRect(x + w + 10 + R() * 40, y + R() * h, 3 + R() * 12, 2 + R() * 4); } // dry-brush tail
  X.restore();
}
// Anton headline word with hard drop shadow
function head(s, x, y, size, fill, shadow = C.ink, align = 'left') {
  X.save(); X.font = font('AN', 0, size); X.textAlign = align; X.lineJoin = 'round';
  X.fillStyle = shadow; X.fillText(s, x + size * .05, y + size * .06);
  X.strokeStyle = shadow; X.lineWidth = size * .07; X.strokeText(s, x, y);
  X.fillStyle = fill; X.fillText(s, x, y); X.restore();
}
function brushHead(s, x, y, size, fill, bg, seed) { const w = tw(s, font('AN', 0, size)); brush(x - 26, y - size * .9, w + 52, size * 1.05, bg, seed); txt(s, x, y, font('AN', 0, size), fill); return w; }
function pill(s, x, y, bg, fg, f = font('MO', 700, 26), h = 60, ls = 4) { const w = tw(s, f, ls) + 56; rr(x, y, w, h, h / 2); X.fillStyle = bg; X.fill(); txt(s, x + 28, y + h * .66, f, fg, 'left', ls); return w; }
function cutout(im, x, y, h) { const w = h * im.width / im.height; X.drawImage(im, x - w / 2, y - h, w, h); }
function photo(im, cx, cy, w, rot) {
  const h = w * im.height / im.width, b = 16;
  X.save(); X.translate(cx, cy); X.rotate(rot);
  X.save(); X.filter = 'blur(26px)'; X.fillStyle = 'rgba(0,0,0,.55)'; X.fillRect(-w / 2 - b + 16, -h / 2 - b + 30, w + 2 * b, h + 2 * b + 50); X.restore();
  X.fillStyle = '#fbfaf6'; X.fillRect(-w / 2 - b, -h / 2 - b, w + 2 * b, h + 2 * b + 50); X.drawImage(im, -w / 2, -h / 2, w, h);
  X.save(); X.rotate(-.06); X.fillStyle = 'rgba(255,214,90,.85)'; X.fillRect(-80, -h / 2 - b - 26, 160, 48); X.restore();
  X.restore();
}
function stamp(lines, cx, cy, rot, col, w, h) {
  X.save(); X.translate(cx, cy); X.rotate(rot); X.globalAlpha = .92; X.strokeStyle = col; X.lineWidth = 9; rr(-w / 2, -h / 2, w, h, 16); X.stroke(); X.lineWidth = 3; rr(-w / 2 + 14, -h / 2 + 14, w - 28, h - 28, 10); X.stroke();
  if (lines.length === 1) txt(lines[0], 0, 26, font('AN', 0, 76), col, 'center', 2); else { txt(lines[0], 0, 4, font('AN', 0, 64), col, 'center', 2); txt(lines[1], 0, 50, font('MO', 700, 22), col, 'center', 4); }
  X.restore();
}
function tick(x, y, r, col = C.green) { X.beginPath(); X.arc(x, y, r, 0, 7); X.fillStyle = col; X.fill(); X.strokeStyle = '#fff'; X.lineWidth = r * .22; X.lineCap = 'round'; X.lineJoin = 'round'; X.beginPath(); X.moveTo(x - r * .42, y + r * .04); X.lineTo(x - r * .12, y + r * .34); X.lineTo(x + r * .45, y - r * .3); X.stroke(); }

// ---------- backgrounds ----------
const BG = ['red', 'navy', 'dark', 'yel', 'navy'];
function backgrounds() {
  for (let i = 0; i < N; i++) {
    const x0 = i * SW;
    if (BG[i] === 'yel') { X.fillStyle = C.y; X.fillRect(x0, 0, SW, SH); }
    else {
      const [a, b] = BG[i] === 'red' ? ['#5c0d14', '#14040a'] : BG[i] === 'dark' ? ['#2a0c10', '#0a0a0e'] : ['#1E3050', C.navy];
      const g = X.createRadialGradient(x0 + 540, 600, 0, x0 + 540, 600, 1000); g.addColorStop(0, a); g.addColorStop(1, b); X.fillStyle = g; X.fillRect(x0, 0, SW, SH);
    }
  }
  // bokeh lights drifting across slide joins
  const R = rng(9); X.save(); X.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 70; i++) { const x = R() * SW * N, y = R() * SH, r = 20 + R() * 90, ix = Math.floor(x / SW); if (BG[ix] === 'yel') continue; const g = X.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(255,${150 + R() * 80 | 0},60,${.08 + R() * .1})`); g.addColorStop(1, 'rgba(255,150,60,0)'); X.fillStyle = g; X.fillRect(x - r, y - r, r * 2, r * 2); }
  X.restore();
  // grain
  X.save(); X.globalAlpha = .06; for (let i = 0; i < 26000; i++) { X.fillStyle = R() < .5 ? '#000' : '#fff'; X.fillRect(R() * SW * N, R() * SH, 2, 2); } X.restore();
  // continuous bottom track
  const y = 1268; X.strokeStyle = 'rgba(255,206,50,.5)'; X.lineWidth = 4; X.setLineDash([14, 12]); X.beginPath(); X.moveTo(0, y); X.lineTo(SW * N, y); X.stroke(); X.setLineDash([]);
}
function chrome(i) {
  const x0 = i * SW, yel = BG[i] === 'yel', y = 1268;
  X.save(); X.fillStyle = yel ? C.y : 'rgba(10,10,14,.0)'; X.restore();
  X.beginPath(); X.arc(x0 + 110, y, 22, 0, 7); X.fillStyle = yel ? C.ink : C.y; X.fill();
  rr(x0 + 140, y - 28, 150, 56, 28); X.fillStyle = yel ? C.ink : 'rgba(0,0,0,.55)'; X.fill();
  txt(`0${i + 1} / 0${N}`, x0 + 162, y + 10, font('MO', 700, 26), '#fff', 'left', 3);
  // handle pill top-left (like Taufik's thumbnails, but top so it never hides content)
  rr(x0 + 56, 52, 290, 60, 30); X.fillStyle = 'rgba(0,0,0,.78)'; X.fill();
  X.beginPath(); X.arc(x0 + 88, 82, 10, 0, 7); X.fillStyle = C.y; X.fill();
  txt('@taufik.pg', x0 + 108, 93, font('IN', 800, 32), '#fff');
  if (i < N - 1) {
    const ax = x0 + SW - 96;
    X.beginPath(); X.arc(ax, y, 46, 0, 7); X.fillStyle = yel ? C.ink : C.y; X.fill();
    X.strokeStyle = yel ? C.y : C.ink; X.lineWidth = 8; X.lineCap = 'round'; X.lineJoin = 'round';
    X.beginPath(); X.moveTo(ax - 16, y); X.lineTo(ax + 16, y); X.moveTo(ax + 2, y - 15); X.lineTo(ax + 17, y); X.lineTo(ax + 2, y + 15); X.stroke();
    rr(ax - 210, y - 26, 140, 52, 26); X.fillStyle = yel ? C.ink : 'rgba(0,0,0,.6)'; X.fill();
    txt('SWIPE', ax - 140, y + 9, font('MO', 700, 24), C.y, 'center', 4);
  }
}

// ---------- slides ----------
const S = [
  function s1(x) {
    cutout(IMG.point, x + 880, 1225, 960);
    brushHead('RAMAI', x + 80, 300, 120, '#fff', C.ink, 3);
    head('KECUNDANG', x + 70, 465, 150, C.y);
    head('SEBAB NAK', x + 70, 610, 130, '#fff');
    brushHead('CEPAT KAYA!', x + 80, 780, 140, '#fff', C.red, 7);
    para('Di era video pendek & siaran langsung, kita makin terburu-buru dengan duit.', x + 72, 900, font('IN', 800, 38), 50, '#fff', 520);
  },
  function s2(x) {
    pill('MASALAHNYA', x + 70, 170, C.red, '#fff');
    head('TUMPUAN', x + 70, 380, 150, '#fff');
    head('MAKIN PENDEK', x + 70, 530, 150, C.y);
    para('Kita sentiasa tercari-cari jalan pintas yang janji pulangan segera, tanpa usaha.', x + 72, 640, font('IN', 800, 40), 52, 'rgba(255,255,255,.9)', 900);
    // phone with "get-rich" feed
    X.save(); X.translate(x + 300, 1000); X.rotate(-.05); X.scale(.86, .86);
    rr(-170, -260, 340, 520, 44); X.fillStyle = '#111'; X.fill(); X.strokeStyle = '#555'; X.lineWidth = 4; X.stroke();
    rr(-150, -235, 300, 470, 30); X.fillStyle = '#1b1b22'; X.fill();
    rr(-130, -215, 120, 40, 20); X.fillStyle = C.red; X.fill(); txt('● LIVE', -70, -187, font('IN', 900, 22), '#fff', 'center');
    txt('UNTUNG', 0, -90, font('AN', 0, 70), C.y, 'center'); txt('SEGERA!', 0, -15, font('AN', 0, 70), '#fff', 'center');
    txt('tanpa usaha · dijamin', 0, 30, font('IN', 800, 22), 'rgba(255,255,255,.7)', 'center');
    rr(-110, 70, 220, 60, 30); X.fillStyle = C.green; X.fill(); txt('MASUK SEKARANG', 0, 109, font('IN', 900, 22), '#fff', 'center');
    txt('12k suka · 3k komen', 0, 190, font('IN', 800, 22), 'rgba(255,255,255,.6)', 'center');
    X.restore();
    stamp(['IKLAN PALSU', 'CONTOH SAHAJA'], x + 330, 1110, -.12, C.red, 380, 130);
    // shortcut road sign
    X.save(); X.translate(x + 780, 1000);
    X.fillStyle = '#888'; X.fillRect(-10, -40, 20, 170);
    X.rotate(-.06); rr(-210, -220, 420, 170, 18); X.fillStyle = C.y; X.fill(); X.strokeStyle = C.ink; X.lineWidth = 8; rr(-196, -206, 392, 142, 12); X.stroke();
    txt('JALAN PINTAS', 0, -128, font('AN', 0, 62), C.ink, 'center'); X.fillStyle = C.ink; X.beginPath(); X.moveTo(120, -100); X.lineTo(170, -84); X.lineTo(120, -68); X.fill(); X.fillRect(40, -90, 84, 12);
    X.restore();
    txt('jalan pintas = jalan sesat', x + 780, 1190, font('IN', 800, 30), '#ff8a80', 'center');
  },
  function s3(x) {
    pill('HAKIKAT PAHIT', x + 70, 170, C.y, C.ink);
    head('YANG RAMAI', x + 70, 360, 130, '#fff'); head('ENGGAN TERIMA', x + 70, 500, 130, C.y);
    // RUGI vs UNTUNG
    rr(x + 70, 570, 450, 380, 30); X.fillStyle = C.red; X.fill();
    txt('RUGI', x + 295, 720, font('AN', 0, 150), '#fff', 'center');
    para('Sentiasa ada dalam tangan.', x + 295, 800, font('IN', 900, 36), 46, '#fff', 380, 'center');
    X.save(); X.setLineDash([18, 14]); X.strokeStyle = 'rgba(255,255,255,.6)'; X.lineWidth = 6; rr(x + 560, 570, 450, 380, 30); X.stroke(); X.restore();
    txt('UNTUNG', x + 785, 720, font('AN', 0, 130), 'rgba(255,255,255,.55)', 'center');
    para('Belum tentu dapat.', x + 785, 800, font('IN', 900, 36), 46, 'rgba(255,255,255,.7)', 380, 'center');
    txt('?', x + 985, 660, font('AN', 0, 80), 'rgba(255,255,255,.35)', 'center');
    // conclusion
    rr(x + 70, 990, 940, 200, 28); X.fillStyle = 'rgba(0,0,0,.45)'; X.fill(); X.strokeStyle = 'rgba(224,38,46,.7)'; X.lineWidth = 3; X.stroke();
    para('Sikap terburu-buru inilah punca ribuan mangsa terperangkap dalam skim pelaburan palsu.', x + 110, 1065, font('IN', 800, 38), 50, '#fff', 860);
  },
  function s4(x) {
    cutout(IMG.books, x + 830, 1225, 860);
    pill('PESAN GURU SAYA', x + 70, 170, C.ink, C.y);
    txt('Kejar kekayaan itu bagus.', x + 72, 310, font('PF', 700, 54, true), C.ink);
    txt('Tapi yang jauh lebih penting:', x + 72, 380, font('IN', 800, 36), 'rgba(11,11,11,.75)');
    brushHead('ELAK', x + 82, 520, 130, C.y, C.ink, 11);
    brushHead('JATUH', x + 82, 670, 130, C.y, C.ink, 12);
    brushHead('MISKIN.', x + 82, 820, 130, '#fff', C.red, 13);
    // the rule
    rr(x + 70, 900, 450, 300, 26); X.fillStyle = C.ink; X.fill();
    txt('Melabur bukan untuk', x + 100, 960, font('IN', 800, 32), 'rgba(255,255,255,.8)');
    txt('cari duit lebih.', x + 100, 1002, font('IN', 800, 32), 'rgba(255,255,255,.8)');
    txt('Melabur HANYA bila', x + 100, 1068, font('IN', 900, 32), C.y);
    txt('dah ada lebihan', x + 100, 1112, font('IN', 900, 32), C.y);
    txt('simpanan yang selamat.', x + 100, 1156, font('IN', 900, 32), C.y);
  },
  function s5(x) {
    cutout(IMG.chest, x + 880, 1225, 840);
    photo(IMG.tray, x + 300, 400, 400, -.07);
    txt('hasil sabar, bukan jalan pintas', x + 300, 690, font('PF', 700, 30, true), C.y, 'center');
    head('PERNAH HAMPIR', x + 70, 800, 84, '#fff'); head('TERJEBAK?', x + 70, 890, 84, C.y);
    txt('Kongsi pengalaman di komen ↓', x + 72, 945, font('IN', 800, 34), '#fff');
    txt('Benteng kewangan keluarga', x + 72, 995, font('IN', 800, 30), 'rgba(255,255,255,.75)'); txt('bermula dengan...', x + 72, 1035, font('IN', 800, 30), 'rgba(255,255,255,.75)');
    X.save(); X.translate(x + 72, 1212); X.rotate(-.03); head('SABAR!', 0, 0, 150, gold(0, -150, 500, 0), C.ink); X.restore();
  },
];

window.ready = Promise.all([
  ...[font('AN', 0, 40), font('PF', 900, 40), font('PF', 700, 40, true), font('IN', 500, 40), font('IN', 800, 40), font('IN', 900, 40), font('MO', 700, 40)].map(f => document.fonts.load(f)),
  ...Object.entries({ point: 'tunjuk-kamera.png', books: 'pegang-buku-guru.png', chest: 'thumb-dada.png', tray: 'koleksi-dulang-1kg.jpg', bar250: 'jongkong-250g-merah.jpg' })
    .map(([k, f]) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.src = 'img/' + f; })),
]).then(() => {
  backgrounds();
  S.forEach((fn, i) => { X.save(); X.beginPath(); X.rect(i * SW, 0, SW, SH); X.clip(); fn(i * SW); X.restore(); chrome(i); });
  // CTA strip on the last slide (over the track)
  const x0 = (N - 1) * SW; ['LIKE', 'SHARE', 'FOLLOW'].forEach((l, i) => { const cx = x0 + 420 + i * 196; rr(cx - 88, 1240, 176, 56, 28); X.fillStyle = i === 2 ? C.y : 'rgba(0,0,0,.75)'; X.fill(); txt(l, cx, 1278, font('IN', 900, 26), i === 2 ? C.ink : '#fff', 'center', 3); });
  return true;
});
</script>
</body>
</html>
